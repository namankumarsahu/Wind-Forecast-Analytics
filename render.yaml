# Render Blueprint for the FastAPI backend (https://render.com/docs/blueprint-spec).
# After the first deploy set CORS_ORIGINS to your Vercel URL (no trailing slash).
services:
  - type: web
    name: wind-forecast-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        sync: false
      - key: PREFETCH_ON_STARTUP
        value: "true"
      - key: CACHE_DIR
        value: /tmp/elexon-cache
